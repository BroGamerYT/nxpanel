# Nur fuer die Entwicklung: oeffnet Postgres und Redis auf localhost,
# damit das Panel ausserhalb von Docker dagegen laufen kann.
# Im Betrieb NICHT verwenden - dort bleiben beide im internen Netz.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks: [nxp-internal, nxp-public]

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    networks: [nxp-internal, nxp-public]
