name: NexusCore Release

# Baut den Windows-Installer (NexusCore-Setup.msi) und das Linux-Paket (NexusCore-linux.tar.gz) und legt beides als ein Release an.
# Das Release entsteht erst, wenn beide Pakete gebaut sind (kein halbes Release). Es ist zuerst eine Vorabversion: nach dem Test auf
# GitHub den Haken "Pre-release" entfernen - erst dann bietet der Core das Update allen an.
# Gestartet wird mit einem Tag der Form core-vX.Y.Z (z. B. core-v0.3.8) - die Zahl muss nexuscore/package.json entsprechen.
# Der Core fragt dieses Release ab und bietet das Update im Admin-Hub an.
on:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows-Installer (MSI) bauen
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag und Version vergleichen
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $pkg = (Get-Content nexuscore/package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "core-v$pkg") { throw "Tag $tag passt nicht zur Version $pkg in nexuscore/package.json" }

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Abhaengigkeiten
        shell: pwsh
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix nexuscore ci

      - name: Weboberflaeche bauen
        run: npm --prefix web run build

      - name: WiX installieren
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Tests
        run: npm --prefix nexuscore test

      - name: Release-Text aus dem Changelog (nur diese Version)
        shell: pwsh
        run: |
          $ver = (Get-Content nexuscore/package.json -Raw | ConvertFrom-Json).version
          $lines = Get-Content nexuscore/docs/CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($ver))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "Kein Eintrag für $ver in nexuscore/docs/CHANGELOG.md" }
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $section = if ($next) { $rest[0..($next - 2)] } else { $rest }
          Set-Content -Path release-notes.md -Value (@($lines[$start - 1]) + $section) -Encoding utf8

      - name: Installer bauen
        shell: pwsh
        run: ./nexuscore/scripts/build-windows-package.ps1

      - name: MSI und Release-Text weitergeben
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            nexuscore/dist/NexusCore-Setup.msi
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  linux-package:
    name: Linux-Paket bauen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag und Version vergleichen
        run: |
          pkg="$(node -p "require('./nexuscore/package.json').version")"
          if [ "${{ github.ref_name }}" != "core-v$pkg" ]; then echo "::error::Tag ${{ github.ref_name }} passt nicht zur Version $pkg in nexuscore/package.json"; exit 1; fi

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Paket bauen (Weboberflaeche, Core, Archiv - jeder Schritt wird geprueft)
        run: bash nexuscore/scripts/build-linux-package.sh

      - name: Paket weitergeben
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: nexuscore/dist-package/NexusCore-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release veroeffentlichen
    needs: [windows-installer, linux-package]
    runs-on: ubuntu-latest

    steps:
      - name: Pakete holen
        uses: actions/download-artifact@v4
        with:
          path: pakete

      - name: Pakete pruefen
        run: |
          find pakete -type f -printf '%p %s Byte\n'
          test -s pakete/windows/nexuscore/dist/NexusCore-Setup.msi || { echo "::error::MSI fehlt"; exit 1; }
          test -s pakete/windows/release-notes.md || { echo "::error::Release-Text fehlt"; exit 1; }
          test -s pakete/linux/NexusCore-linux.tar.gz || { echo "::error::Linux-Paket fehlt"; exit 1; }

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: "NexusCore ${{ github.ref_name }}"
          prerelease: true
          draft: false
          body_path: pakete/windows/release-notes.md
          files: |
            pakete/windows/nexuscore/dist/NexusCore-Setup.msi
            pakete/linux/NexusCore-linux.tar.gz
