[package]
name = "nexuscore"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenv = "0.15"

# Planungsstand - siehe README.md in diesem Ordner.
# Aktuell nicht baubar: Modulpfade sind falsch und auf diesem Rechner fehlt
# der MSVC-Linker (link.exe aus den Visual Studio Build Tools).
[[bin]]
name = "nexuscore-server"
path = "src/main.rs"

[lib]
name = "nexuscore"
path = "src/lib.rs"