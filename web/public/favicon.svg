<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glow" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="plate" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Hexagon-Schild Grundkörper -->
  <polygon points="32,4 58,19 58,45 32,60 6,45 6,19" fill="url(#plate)" stroke="url(#glow)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Innere Struktur: Server-Ebenen / Nexus-Waben -->
  <path d="M16 22 L32 13 L48 22 L32 31 Z" fill="#334155" opacity="0.6" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M16 32 L32 23 L48 32 L32 41 Z" fill="#1e293b" opacity="0.8" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M16 42 L32 33 L48 42 L32 51 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Nexus Kern-Symbol (Leuchtender Puls) -->
  <circle cx="32" cy="32" r="4.5" fill="#fbbf24" filter="url(#shadow)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />

  <!-- Status-LEDs an den Ecken -->
  <circle cx="16" cy="22" r="1.5" fill="#f59e0b" />
  <circle cx="48" cy="22" r="1.5" fill="#f59e0b" />
  <circle cx="32" cy="51" r="1.5" fill="#f59e0b" />
</svg>
